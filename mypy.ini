[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True

# Ignore missing imports for local modules in specific contexts
[mypy-gcloud_utils]
ignore_missing_imports = True

[mypy-constants]
ignore_missing_imports = True

[mypy-utils.info_sending_utils]
ignore_missing_imports = True